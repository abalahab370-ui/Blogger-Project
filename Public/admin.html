<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSpace Admin Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

    <!-- Adaptive Top Bar -->
    <header class="border-b border-gray-200 bg-white sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="font-bold text-lg text-gray-900">🛡️ DevSpace Admin</h1>
                <span class="text-[10px] font-mono font-bold bg-red-50 text-red-600 border border-red-200 px-2 py-0.5 rounded uppercase tracking-wider">
                    Role 2020
                </span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p id="adminGreeting" class="text-sm font-semibold text-gray-900">Administrator</p>
                    <p id="adminRoleBadge" class="text-[10px] uppercase font-mono tracking-wider text-red-500 font-medium">System Operator</p>
                </div>
                <button onclick="handleLogout()" class="text-xs border border-gray-300 bg-gray-50 hover:bg-gray-100 px-3 py-1.5 rounded text-gray-600 font-medium cursor-pointer transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Admin Workspace Layout -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
        
        <!-- Dashboard Header & Status Banner -->
        <section class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-base font-bold text-gray-900 mb-1">Global Content Moderation</h2>
                <p class="text-xs text-gray-500">Full administrative privileges active. You can search, review, and delete any published article.</p>
            </div>
            
            <div class="flex gap-2">
                <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-center">
                    <p class="text-[10px] uppercase font-mono text-gray-400 font-semibold">Access Level</p>
                    <p class="text-xs font-bold text-gray-800">2020 (Admin)</p>
                </div>
                <div class="px-3 py-2 bg-emerald-50 border border-emerald-100 rounded-lg text-center">
                    <p class="text-[10px] uppercase font-mono text-emerald-600 font-semibold">Override Mode</p>
                    <p class="text-xs font-bold text-emerald-700">Enabled</p>
                </div>
            </div>
        </section>

        <!-- Search Bar -->
        <section class="bg-white p-3 rounded-xl border border-gray-200 shadow-xs">
            <input type="text" id="adminSearchBar" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:bg-white focus:ring-1 focus:ring-red-500" placeholder="🔍 Search any article or author across the platform...">
        </section>

        <!-- Moderation Feed Grid -->
        <section id="adminFeed" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Articles injected via admin.js -->
            <div class="col-span-full text-center py-12 text-gray-400 text-sm bg-white rounded-xl border border-gray-200">
                Loading moderation feed...
            </div>
        </section>

    </main>

    <script src="admin.js"></script>
    <script>initAdminPage();</script>
</body>
</html>
