<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSpace Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

    <!-- Header Navigation -->
    <header class="border-b border-gray-200 bg-white sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-4 h-16 flex justify-between items-center">
            <h1 class="font-bold text-lg text-gray-900 flex items-center gap-2">
                🚀 DevSpace Hub
            </h1>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p id="userGreeting" class="text-sm font-semibold text-gray-900">Guest</p>
                    <p id="userRoleBadge" class="text-[10px] uppercase font-mono tracking-wider text-gray-400">Loading profile...</p>
                </div>
                <button id="logoutBtn" class="text-xs border border-gray-300 bg-gray-50 hover:bg-gray-100 px-3 py-1.5 rounded text-gray-600 font-medium cursor-pointer transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Centered Stack Workspace -->
    <main class="max-w-2xl mx-auto px-4 py-8 space-y-6">
        
        <!-- 1. Creator Form Card -->
        <section class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
            <div class="mb-4">
                <h2 class="text-base font-bold text-gray-900">Publish an Article</h2>
                <p class="text-xs text-gray-500">Share your thoughts with the community. Your username will automatically be pinned as the author.</p>
            </div>
            
            <form id="publishForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Title</label>
                        <input type="text" id="title" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none" placeholder="Article Title">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Category</label>
                        <input type="text" id="category" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Technology">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Content Body</label>
                    <textarea id="content" required rows="4" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none" placeholder="Write your post content here..."></textarea>
                </div>
                <button type="submit" id="submitPostBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded text-sm transition cursor-pointer">
                    Commit to Feed
                </button>
            </form>
        </section>

        <!-- 2. Search Box -->
        <section>
            <input type="text" id="searchBar" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm shadow-xs focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder-gray-400" placeholder="🔍 Search articles by title live...">
        </section>

        <!-- 3. Dynamic Post Feed (Displays directly under search) -->
        <section id="dynamicFeed" class="space-y-4">
            <!-- user.js renders post matching search here -->
        </section>

    </main>

    <!-- Connected directly to user.js -->
    <script src="user.js"></script>
    <script>initUserHub();</script>
</body>
</html>
