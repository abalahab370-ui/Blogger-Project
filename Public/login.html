<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSpace // Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="w-full max-w-md bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
        <h1 id="authTitle" class="text-2xl font-bold text-gray-900 mb-1 text-center">Welcome Back</h1>
        <p id="authSubtitle" class="text-xs text-gray-500 text-center mb-6">Log in to manage and publish your articles.</p>

        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Username</label>
                <input type="text" id="username" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Password</label>
                <input type="password" id="password" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded text-sm transition cursor-pointer">
                Sign In
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-100 text-center">
            <button id="toggleAuthMode" class="text-xs text-blue-600 hover:underline cursor-pointer">
                Don't have an account? Create one here
            </button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>initAuthPage();</script>
</body>
</html>
